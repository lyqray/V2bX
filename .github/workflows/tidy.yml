name: Go Mod Tidy

on:
  push:
    paths:
      - "**/*.go"      # 监控任何代码修改
      - "go.mod"       # 监控依赖定义修改
  workflow_dispatch:

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false 
          # 【关键修改 1】: 使用 PAT 进行检出，这样后续的 commit 才能被视为“人类推送”，防止后续 Action 不触发！
          token: ${{ secrets.MY_PAT }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Force Cleanup and Re-Tidy
        run: |
          # 1. 彻底清理本地模块缓存，防止错误的 quic-go 版本残留
          go clean -modcache
          go clean -cache
          
          # 2. 删除 go.sum，让 Go 重新计算所有依赖的哈希值
          rm -f go.sum
          
          # 3. 这里的关键：执行 tidy
          # 它会根据你最新的 conn.go（删除了 sing-box 引用）
          # 以及你清理后的 go.mod（删除了冲突的 quic-go 行）
          # 自动去下载 Hysteria2 真正需要的那个版本的 quic-go。
          go mod tidy

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-tidy go.mod and go.sum"
          file_pattern: 'go.mod go.sum'
          # 【关键修改 2】: 确保 commit 行为也携带 PAT 身份
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
